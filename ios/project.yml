# XcodeGen spec — the .xcodeproj is generated, not committed (see docs/IOS.md):
#   brew install xcodegen && cd ios && xcodegen generate
name: PitPass
options:
  bundleIdPrefix: com.arjunakankipati
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # iPad only for now: the broadcast surface is an iPad Pro 11".
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID team in Xcode (Signing & Capabilities) or here:
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  # SVG rasterizer (zlib licence): manufacturer marks are uploaded as SVG and
  # UIKit has no decoder for them.
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    exactVersion: 0.29.0
targets:
  PitPass:
    type: application
    platform: iOS
    sources:
      - path: PitPass
    dependencies:
      - package: SwiftDraw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.pitpass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
    info:
      path: PitPass/Info.plist
      properties:
        CFBundleDisplayName: Pit Pass
        CFBundleName: Pit Pass
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Sign-in callback: the backend's DeviceLoginSuccessHandler redirects
        # to pitpass://auth?code=… and ASWebAuthenticationSession catches it.
        CFBundleURLTypes:
          - CFBundleURLName: com.arjunakankipati.pitpass.auth
            CFBundleURLSchemes: [pitpass]
        # Pit-lane walk-to-box guidance (PitLaneSheet) and anchor capture.
        NSLocationWhenInUseUsageDescription: Pit Pass uses your location to guide you to a pit box along the lane.
        # Local dev server is plain http://localhost:8731.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # Offline scratchpad ink replays in the background (PadSyncer).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.arjunakankipati.pitpass.padsync]
        # The website's faces (Inter UI, JetBrains Mono data), decompressed
        # from the @fontsource woff2 subsets — see docs/IOS.md "Design".
        UIAppFonts:
          - inter-latin-wght-normal.ttf
          - jetbrains-mono-latin-wght-normal.ttf
  PitPassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitPassTests
    dependencies:
      - target: PitPass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.pitpass.tests
schemes:
  PitPass:
    build:
      targets:
        PitPass: all
        PitPassTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PitPassTests]
