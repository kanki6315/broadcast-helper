<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48">
  <!-- PWA / home-screen source icon. Same BH wordmark as favicon.svg but a
       FULL-BLEED square (no rx): iOS rounds home-screen icons itself and fills
       transparency with black, and maskable icons get cropped to a circle. The
       mark's ~24% padding keeps it inside the maskable safe zone. -->
