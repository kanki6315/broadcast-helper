<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Broadcast Helper wordmark for the browser tab. Rounded tile (rx) because a
       favicon is shown as-is, never system-masked. Matches the home-screen icon:
       dark warm-charcoal plate with the gold BH mark. Letters are stroked
       geometric forms so the mark renders identically without a font. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302619"/>
      <stop offset="1" stop-color="#14100a"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>
  <g fill="none" stroke="#f0b84a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- B -->
    <path d="M11.5 13.5V34.5"/>
    <path d="M11.5 13.5H16C19.5 13.5 20.5 15.6 20.5 18.75C20.5 21.9 19.5 24 16 24H11.5"/>
    <path d="M11.5 24H16.5C20.2 24 21.3 26.1 21.3 29.25C21.3 32.4 20.2 34.5 16.5 34.5H11.5"/>
    <!-- H -->
    <path d="M28 13.5V34.5"/>
    <path d="M37.5 13.5V34.5"/>
    <path d="M28 24H37.5"/>
  </g>
</svg>
