[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitpass-parser"
version = "1.0.0"
description = "IMSA/PACCA entry-list, points, and team-sheet PDF parsers (pdfplumber sidecars)"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.scripts]
parse-entry-list = "parse_entry_list:main"
parse-points = "parse_points:main"
extract-team-sheet-pages = "extract_team_sheet_pages:main"

# Explicit py-modules, not auto-discovery: the flat multi-module layout would
# otherwise error out, and listing the three scripts keeps tests and samples/
# out of the wheel. The scripts stay runnable as plain files too — the backend's
# ProcessBuilder invocation (`python parse_entry_list.py <pdf>`) is unchanged.
[tool.setuptools]
py-modules = ["parse_entry_list", "parse_points", "extract_team_sheet_pages"]
