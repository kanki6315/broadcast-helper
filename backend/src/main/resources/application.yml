# Include exception reasons in error responses so the UI can show the user
# why an import failed (e.g. "No series or series alias matches ...").
server:
  # Railway (and most PaaS) inject the port to listen on via $PORT.
  port: ${PORT:8080}
  # Behind Railway's TLS-terminating proxy the app receives plain http; honour the
  # X-Forwarded-* headers so Spring rebuilds the original https origin. Without this
  # the OAuth redirect_uri is built as http://, which Google rejects. Harmless in
  # local dev (no forwarded headers → the real request scheme is used).
  forward-headers-strategy: framework
  error:
    include-message: always
  servlet:
    session:
      # Idle window: the login survives up to this long between requests (sliding
      # — active use keeps it alive). Sessions live in Postgres (Spring Session
      # JDBC, see spring.session below), so they now survive a redeploy; only
      # this idle window or an explicit logout ends one. Spring Session reads
      # this property when spring.session.timeout is unset.
      timeout: 3d
      cookie:
        # SameSite=Lax keeps the session cookie off cross-site requests, which
        # mitigates CSRF for our state-changing POSTs (we don't run CSRF tokens).
        same-site: lax
        # Persist the cookie past browser close (without this it's a session
        # cookie the browser drops on exit). It's only an opaque session id —
        # inert once the idle window lapses — so it never outlives the
        # server-side session. Headroom past the 3d idle window so continuous
        # use can't hit an absolute cap mid-session.
        max-age: 7d

# The Python sidecar that turns entry-list PDFs into entries.json
# (see parser/SCHEMA.md). Local defaults are relative to the backend working
# directory; in the container these point at the bundled copy via env.
pit-pass:
  entry-list-parser:
    python: ${PARSER_PYTHON:python3}
    script: ${PARSER_SCRIPT:../parser/parse_entry_list.py}
  # Sibling sidecar (same python) mapping a team-sheets PDF's pages to cars.
  team-sheet-parser:
    script: ${TEAM_SHEET_PARSER_SCRIPT:../parser/extract_team_sheet_pages.py}
  # Sibling sidecar (same python) turning a championship-points PDF into the
  # standings JSON shape, for the series that publish no points JSON.
  points-parser:
    script: ${POINTS_PARSER_SCRIPT:../parser/parse_points.py}
  # iRacing Data API. Blank by default: local dev and CI import the exported
  # subsession file instead, which is byte-identical to what the API returns.
  # The client id is issued by iRacing on request and cannot be self-served —
  # they paused issuance in 2025, so treat ours as irreplaceable.
  iracing:
    client-id: ${IRACING_CLIENT_ID:}
    client-secret: ${IRACING_CLIENT_SECRET:}
    # The iRacing account email, and its password. Both are masked before they
    # leave the process (see IRacingClient.mask) but are plaintext in the env.
    username: ${IRACING_USERNAME:}
    password: ${IRACING_PASSWORD:}
    # Default to the live service, so a missing override talks to iRacing rather
    # than failing quietly. Overridden only to point at a stub.
    token-url: ${IRACING_TOKEN_URL:https://oauth.iracing.com/oauth2/token}
    data-base: ${IRACING_DATA_BASE:https://members-ng.iracing.com/data}

# Auth. Disabled by default so local dev needs no Google creds; set
# AUTH_ENABLED=true + the Google client on the hosted deployment. Who may sign
# in (and who may write) lives in the app_user table, managed from Manage →
# Users — bootstrap the first admin via psql (see docs/DEPLOY.md).
pit-pass.auth:
  enabled: ${AUTH_ENABLED:false}

spring:
  session:
    # Sessions in Postgres so a redeploy doesn't sign everyone out. Flyway owns
    # the schema (V34), so Spring Session must not try to create it.
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # Bulk image upload: a full grid can be 50+ photos of several MB each.
      max-file-size: 25MB
      max-request-size: 500MB
  # The Google OAuth registration is intentionally NOT declared here: an empty
  # client-id fails Spring's startup validation, and local dev has no creds. The
  # hosted deployment supplies it via env (Google's provider details are built in,
  # so only the id + secret are needed):
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
  datasource:
    # Env-driven for hosting (Railway Postgres vars); local dev defaults preserved.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pit_pass}
    username: ${SPRING_DATASOURCE_USERNAME:pitpass}
    password: ${SPRING_DATASOURCE_PASSWORD:pitpass}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
