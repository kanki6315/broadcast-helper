# Include exception reasons in error responses so the UI can show the user
# why an import failed (e.g. "No series or series alias matches ...").
server:
  error:
    include-message: always

# The Python sidecar that turns entry-list PDFs into entries.json
# (see parser/SCHEMA.md). Paths are relative to the backend working directory.
broadcast-helper:
  entry-list-parser:
    python: python3
    script: ../parser/parse_entry_list.py

spring:
  servlet:
    multipart:
      # Bulk image upload: a full grid can be 50+ photos of several MB each.
      max-file-size: 25MB
      max-request-size: 500MB
  datasource:
    url: jdbc:postgresql://localhost:5432/broadcast_helper
    username: broadcast
    password: broadcast
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
