plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pitpass'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// Sessions in Postgres rather than Tomcat's memory, so a redeploy doesn't
	// sign everyone out (the app ships often). Schema is owned by Flyway (V34).
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Image downscaling + WebP encoding for car-image variants (bundled native
	// dwebp/cwebp binaries for linux/mac/windows).
	implementation 'com.sksamuel.scrimage:scrimage-core:4.1.3'
	implementation 'com.sksamuel.scrimage:scrimage-webp:4.1.3'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Local dev only: run bootRun under the `local` Spring profile so it loads the
// gitignored src/main/resources/application-local.yml (iRacing credentials).
// Scoped to bootRun deliberately — the container runs `java -jar` (see Dockerfile),
// so production never activates this profile, and `test` doesn't either (its
// stub-based tests assert the unconfigured path).
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', 'local'
}
